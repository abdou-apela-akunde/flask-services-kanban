<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Service 2</title>
</head>
<body>
    <h1>Test du Service 2</h1>

    <p>Cette page sert à tester les routes du service 2.</p>

    <button onclick="testerDescription()">Tester la description</button>
    <button onclick="testerCorrelation()">Tester la correlation</button>
    <button onclick="testerNormalite()">Tester la normalite</button>

    <h2>Résultat</h2>
    <pre id="resultat"></pre>

    <script>
        function afficherResultat(data) {
            document.getElementById("resultat").textContent =
                JSON.stringify(data, null, 2);
        }

        function testerDescription() {
            fetch("http://127.0.0.1:5002/stats/describe", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    "data": [12, 15, 8, 21, 13, 10]
                })
            })
            .then(reponse => reponse.json())
            .then(data => afficherResultat(data));
        }

        function testerCorrelation() {
            fetch("http://127.0.0.1:5002/stats/correlation", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    "x": [1, 2, 3, 4],
                    "y": [2, 4, 6, 8]
                })
            })
            .then(reponse => reponse.json())
            .then(data => afficherResultat(data));
        }

        function testerNormalite() {
            fetch("http://127.0.0.1:5002/stats/test_normalite", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    "data": [12, 13, 14, 15, 16, 14, 13, 15]
                })
            })
            .then(reponse => reponse.json())
            .then(data => afficherResultat(data));
        }
    </script>
</body>
</html>
