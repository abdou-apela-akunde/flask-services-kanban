service3_stats_mysql/tests_html/test_correlation.html<!DOCTYPE html>
<html>
<head>
    <title>Test Correlation</title>
</head>
<body>

<button onclick="tester()">Tester</button>

<pre id="resultat"></pre>

<script>
async function tester() {

    const response = await fetch(
        "http://127.0.0.1:5003/db/stats/correlation?serie_x=serie_A&serie_y=serie_B"
    );

    const data = await response.json();

    document.getElementById("resultat").textContent =
        JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
